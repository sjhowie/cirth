<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cirth</title>
    <!-- No page icon (the window uses the exe's); this stops the webview requesting /favicon.ico and logging a 404. -->
    <link rel="icon" href="data:," />
    <!--
      First paint in the right theme, before app.css loads (Vite injects it late in dev) and before settings load.
      Rust injects __CIRTH_THEME__ (the theme setting); the rule matches isDark() in settings.svelte.ts.
    -->
    <style>
      html { background: #ffffff; }
      html[data-theme="dark"] { background: #282c34; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var t = window.__CIRTH_THEME__;
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app" style="display: contents"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
