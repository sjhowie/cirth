[package]
name = "cirth"
version = "0.3.1"
description = "Cirth - a lightweight text editor"
authors = ["Steve Howie"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cirth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
log = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
tempfile = "3"
percent-encoding = "2"
quick-xml = "0.42"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
regex = "1"
notify-debouncer-mini = "0.6"
trash = "5"
dunce = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Thin LTO with the default codegen units: a cold release build took 74 s here against 116 s for fat LTO with
# codegen-units = 1 rebuilding only this crate; the exe is about 1.2 MB larger.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# ReplaceFileW / MoveFileExW / GetFileInformationByHandle: saves keep ACLs, attributes, streams and hard links (files.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# The paths of files dropped on the window (file_drop.rs). Keep in step with the versions wry uses (Cargo.lock).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
