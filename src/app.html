<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    <!--
      First paint in the right theme, before app.css loads (Vite injects it late in dev) and before settings load.
      Rust injects __CIRTH_THEME__ (the theme setting); the rule matches isDark() in settings.svelte.ts.
    -->
    <style>
      html { background: #ffffff; }
      html[data-theme="dark"] { background: #282c34; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var t = window.__CIRTH_THEME__;
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
